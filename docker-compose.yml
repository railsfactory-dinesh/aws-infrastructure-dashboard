version: '3.8'

services:
  # Node.js Dashboard Backend & Application
  aws-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aws-devops-dashboard
    restart: unless-stopped
    expose:
      - "3001"
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - AWS_REGION=us-east-1
      # Optional: Set AWS Secret Name if using AWS Secrets Manager
      # - AWS_SECRET_NAME=my-read-only-aws-secret
    volumes:
      # Mount host AWS credentials and config (read-only) for AWS CLI profiles
      - ~/.aws:/root/.aws:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/profiles"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Port 80)
  nginx:
    image: nginx:alpine
    container_name: aws-dashboard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - aws-dashboard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
