services:
  # Node.js Dashboard Backend & Application (Host network mode for IMDS EC2 IAM Role access)
  aws-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aws-devops-dashboard
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - AWS_REGION=us-east-1
      - AWS_PAGER=
    volumes:
      - ~/.aws:/root/.aws:ro

  # Nginx Reverse Proxy (Port 80)
  nginx:
    image: nginx:alpine
    container_name: aws-dashboard-nginx
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - aws-dashboard
